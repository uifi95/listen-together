# Push a tag like v1.2.0 to build the Mac app zip, publish it as a GitHub
# release, and update the Homebrew cask in uifi95/homebrew-tap.
# Updating the tap needs a HOMEBREW_TAP_TOKEN secret: a fine-grained token with
# Contents read/write on uifi95/homebrew-tap. Without it, copy the
# listen-together.rb attached to the release into the tap's Casks/ by hand.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: |
          ./build.sh "${GITHUB_REF_NAME#v}"
          swift test
      - name: Cask
        run: packaging/cask.sh "${GITHUB_REF_NAME#v}" > dist/listen-together.rb
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes dist/*.zip dist/listen-together.rb
      - name: Update Homebrew cask
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        if: env.TAP_TOKEN != ''
        run: |
          git clone "https://x-access-token:$TAP_TOKEN@github.com/uifi95/homebrew-tap.git" tap
          mkdir -p tap/Casks
          cp dist/listen-together.rb tap/Casks/
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/listen-together.rb
          git commit -m "listen-together ${GITHUB_REF_NAME#v}"
          git push
